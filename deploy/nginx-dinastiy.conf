# nginx для dinastiy.com — фронтенд (статика) + прокси на бэкенд (Node) + WebSocket
# Положить в /etc/nginx/sites-available/dinastiy и слинковать в sites-enabled.
# 443-блок и сертификат добавит certbot автоматически (см. MIGRATION.md).
#
# Если переходите на .ru — замените dinastiy.com на новый домен во всём файле.

server {
    listen 80;
    listen [::]:80;
    server_name dinastiy.com www.dinastiy.com;

    # Собранный фронтенд (client/dist) кладём сюда:
    root /var/www/dinastiy/client;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 60m;  # запас под загрузку обложек/файлов

    # API → Node-бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket для чата поддержки — БЕЗ этого блока чат не работает
    location /socket.io/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Локально загруженные файлы (fallback-путь загрузки на бэкенде)
    location /uploads/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
    }

    # Хэшированные ассеты фронта — долгий кэш
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаём в index.html (иначе /requisites и т.п. → 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
